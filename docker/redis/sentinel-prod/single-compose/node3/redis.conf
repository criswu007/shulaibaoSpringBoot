bind 0.0.0.0
port 6379
protected-mode no

dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

requirepass 123
masterauth 123

# Replicaof master
replicaof 192.168.11.1 6379

repl-backlog-size 256mb
repl-backlog-ttl 3600

replica-serve-stale-data yes
logfile "/logs/redis-replica.log"
