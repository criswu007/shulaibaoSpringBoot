bind 0.0.0.0
port 6379
protected-mode no

# Persistence
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Security
requirepass 123

# Replication & safety
repl-backlog-size 256mb
repl-backlog-ttl 3600
min-replicas-to-write 1
min-replicas-max-lag 10

# Performance & logging
tcp-keepalive 300
logfile "/logs/redis-master.log"
