version: "3.8"
services:
  redis:
    image: redis:8
    container_name: redis-node1
    volumes:
      - /home/tdh/single-compose/node1/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - /home/tdh/single-compose/node1/data:/data
      - /home/tdh/single-compose/node1/logs:/logs
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    restart: always
    networks:
      - redis-net

  sentinel:
    image: redis:8
    container_name: sentinel-node1
    volumes:
      - /home/tdh/single-compose/node1/sentinel.conf:/usr/local/etc/sentinel.conf:ro
    command: ["redis-sentinel", "/usr/local/etc/sentinel.conf"]
    ports:
      - "26379:26379"
    restart: always
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
