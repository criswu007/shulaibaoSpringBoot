
bind 0.0.0.0
port 6380
protected-mode no
dir "/data"
dbfilename "dump.rdb"
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
requirepass "123"
masterauth "123"
repl-backlog-size 64mb
repl-backlog-ttl 3600
min-replicas-to-write 1
min-replicas-max-lag 10
logfile "/logs/redis-replica.log"
replicaof 172.16.207.55 6379
