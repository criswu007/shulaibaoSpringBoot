version: "3.8"
services:
  sentinel:
    image: redis:8
    container_name: sentinel-node3
    volumes:
      - /home/tdh/split-compose/node3/sentinel.conf:/usr/local/etc/sentinel.conf:ro
    command: ["redis-sentinel", "/usr/local/etc/sentinel.conf"]
    ports:
      - "26379:26379"
    restart: always
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
